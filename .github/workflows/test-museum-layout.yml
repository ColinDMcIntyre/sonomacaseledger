name: Museum level integrity
on:
  push:
    paths:
      - "museum/**"
      - "tests/museum-*.test.mjs"
      - ".github/workflows/test-museum-layout.yml"
  pull_request:
    paths:
      - "museum/**"
      - "tests/museum-*.test.mjs"
permissions:
  contents: read
jobs:
  level-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse museum modules
        run: |
          node --check museum/case-dioramas.js
          node --check museum/daylight.js
          node --check museum/lighting.js
          node --check museum/architecture.js
          node --check museum/character.js
          node --check museum/asset-library.js
          node --check museum/museum.js
      - name: Verify level integrity, PBR materials, doors and case routes
        run: node --test tests/museum-*.test.mjs

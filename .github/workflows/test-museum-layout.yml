name: Museum level integrity
on:
  push:
    paths:
      - "museum/**"
      - "tests/museum-*.test.mjs"
      - "tests/renderpeople-license-guard.test.mjs"
      - "tests/high-detail-visitor.test.mjs"
      - "tests/character-pose.test.mjs"
      - "scripts/audit_public_cc0_visitor.py"
      - "scripts/import_cc0_detailed_visitor.py"
      - ".gitignore"
      - "research/RENDERPEOPLE-INTEGRATION-STATUS-2026-11-22.md"
      - ".github/workflows/test-museum-layout.yml"
  pull_request:
    paths:
      - "museum/**"
      - "tests/museum-*.test.mjs"
      - "tests/renderpeople-license-guard.test.mjs"
      - "tests/high-detail-visitor.test.mjs"
      - "tests/character-pose.test.mjs"
      - "scripts/audit_public_cc0_visitor.py"
      - "scripts/import_cc0_detailed_visitor.py"
      - ".gitignore"
      - "research/RENDERPEOPLE-INTEGRATION-STATUS-2026-11-22.md"
permissions:
  contents: read
jobs:
  level-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse museum modules
        run: |
          node --check museum/case-dioramas.js
          node --check museum/daylight.js
          node --check museum/lighting.js
          node --check museum/architecture.js
          node --check museum/character.js
          node --check museum/character-pose.js
          node --check museum/asset-library.js
          node --check museum/museum.js
      - name: Verify level integrity, PBR materials, doors and case routes
        run: node --test tests/museum-*.test.mjs
      - name: Block proprietary Renderpeople files from public browser assets
        run: node --test tests/renderpeople-license-guard.test.mjs
      - name: Verify corrected guide pose and high-detail-first loading
        run: node --test tests/high-detail-visitor.test.mjs tests/character-pose.test.mjs

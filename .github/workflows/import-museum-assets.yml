name: Import free museum props (CC0)
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/import_museum_assets.py'
      - '.github/workflows/import-museum-assets.yml'
permissions:
  contents: write
jobs:
  import-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download selected official Poly Haven models
        run: python3 scripts/import_museum_assets.py
      - name: Commit licensed models and updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add museum/assets/manifest.json museum/assets/models/
          if ! git diff --cached --quiet; then
            git commit -m "Import Poly Haven CC0 museum assets"
            git push
          fi

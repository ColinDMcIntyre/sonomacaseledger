name: Import cathedral PBR HDRI and CC0 visitor
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/import-cathedral-assets.yml
      - scripts/import_cathedral_assets.py
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch verified CC0 architecture materials and visitor
        run: python3 scripts/import_cathedral_assets.py
      - name: Commit downloaded materials and animations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add museum/assets/cathedral museum/assets/characters/visitor.glb museum/assets/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Install cathedral PBR HDRI and CC0 animated visitor"
            git push
          fi
